name: Repository checks
on:
  pull_request:
  push:
    branches: [main, development, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_locks.py
      - run: git diff --check HEAD
  scaffold-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_locks.py
  backend-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firewatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: firewatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIREWATCH_TEST_DATABASE_URL: postgresql+psycopg://firewatch:ci-only-password@127.0.0.1:5432/firewatch_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hashed development lock and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check
      - name: Formatting, lint and types
        run: |
          ruff check src tests migrations scripts/native_postgres.py scripts/verify_bootstrap.py scripts/check_locks.py scripts/export_openapi.py scripts/demo_api.py scripts/demo_data.py scripts/export_handoff.py scripts/verify_demo.py scripts/verify_firms_handoff.py scripts/verify_worker.py scripts/prepare_replays.py scripts/verify_replays.py scripts/verify_pipeline.py scripts/verify_target_labels.py scripts/verify_splits.py
          ruff format --check src tests migrations scripts/native_postgres.py scripts/verify_bootstrap.py scripts/check_locks.py scripts/export_openapi.py scripts/demo_api.py scripts/demo_data.py scripts/export_handoff.py scripts/verify_demo.py scripts/verify_firms_handoff.py scripts/verify_worker.py scripts/prepare_replays.py scripts/verify_replays.py scripts/verify_pipeline.py scripts/verify_target_labels.py scripts/verify_splits.py
          mypy
      - name: Unit, PostgreSQL migration and integrity tests
        run: python -m pytest --cov=firewatch --cov-report=term-missing --junitxml=test-results.xml
      - name: Export frontend OpenAPI contract
        run: |
          python scripts/export_openapi.py
          python -m scripts.export_handoff
          python -m scripts.verify_demo
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-openapi
          path: artifacts/openapi.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-frontend-handoff
          path: artifacts/handoff
          if-no-files-found: error
      - name: Verify CLI and build distributions
        run: |
          firewatch --help
          firewatch --version
          python -m build --no-isolation
      - name: Verify runtime lock in an isolated environment
        run: |
          python -m venv /tmp/firewatch-runtime
          /tmp/firewatch-runtime/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/firewatch-runtime/bin/python -m pip install --no-deps dist/*.whl
          /tmp/firewatch-runtime/bin/python -m pip check
          /tmp/firewatch-runtime/bin/firewatch --help
          /tmp/firewatch-runtime/bin/firewatch verify-pipeline-handoff --help
          /tmp/firewatch-runtime/bin/firewatch verify-target-labels --help
          /tmp/firewatch-runtime/bin/firewatch verify-splits --help
          /tmp/firewatch-runtime/bin/python -c "import pyarrow; from firewatch.pipeline.handoff import feature_schema; assert len(feature_schema()) == 44"
  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install and test native Python package
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e . --no-deps --no-build-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/unit tests/contract -m "not integration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          firewatch --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
