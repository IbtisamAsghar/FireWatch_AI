name: Repository checks
on:
  pull_request:
  push:
    branches: [main, development, devtalha, 'codex/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: dependency-and-secret-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated hashed security tooling
        run: python -m pip install --require-hashes -r requirements-security.lock
      - name: Audit application and development dependency lock
        run: |
          mkdir -p artifacts/security
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps --format json --output artifacts/security/dependencies.json
      - name: Audit security tooling lock
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements-security.lock --disable-pip --no-deps --format json --output artifacts/security/tooling.json
      - name: Scan full Git history and repository worktree
        if: ${{ !cancelled() }}
        run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firewatch-security-reports
          path: artifacts/security
          if-no-files-found: error
          retention-days: 14
  container:
    name: linux-container-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Compose operator dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Build package image without publishing
        run: docker build --pull --tag firewatch-ci:${{ github.sha }} .
      - name: Verify non-root installed package and command overrides
        run: |
          docker run --rm --entrypoint python firewatch-ci:${{ github.sha }} -c "import os, firewatch, pyarrow; assert os.getuid() == 10001; assert not os.path.exists('/app/.env')"
          docker run --rm --entrypoint firewatch firewatch-ci:${{ github.sha }} --help
          docker run --rm --entrypoint python firewatch-ci:${{ github.sha }} -m firewatch.worker --help
          docker run --detach --name firewatch-ci-api --entrypoint uvicorn \
            --env APP_ENV=test \
            --env DATABASE_URL=postgresql+psycopg://test:test-password@127.0.0.1:1/firewatch_test \
            --env ADMIN_API_TOKEN=test-only-container-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
            firewatch-ci:${{ github.sha }} firewatch.main:app --host 0.0.0.0 --port 8000
          trap 'docker rm --force firewatch-ci-api >/dev/null' EXIT
          docker exec --interactive firewatch-ci-api python - < scripts/container_probe.py
          mkdir -p artifacts
          docker image inspect firewatch-ci:${{ github.sha }} --format '{{json .Id}}' > artifacts/container-image-id.json
      - name: Full stack, durable volumes and optional internal services
        run: |
          docker tag firewatch-ci:${{ github.sha }} firewatch-backend:phase56-ci
          python -m scripts.verify_compose --no-build --image-tag phase56-ci --optional-services
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firewatch-compose-acceptance
          path: artifacts/phase-5.6-compose.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-container-build
          path: artifacts/container-image-id.json
          if-no-files-found: error
  contracts:
    name: solidity-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned native contract toolchain
        run: python scripts/contract_tools.py install
      - name: Forge tests and isolated loopback Anvil deployment
        run: python scripts/contract_tools.py smoke
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-local-contract-acceptance
          path: artifacts/phase-5.3-smoke.json
          if-no-files-found: error
  scaffold:
    name: scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_locks.py
      - run: git diff --check HEAD
  scaffold-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_scaffold.py
      - run: python scripts/check_locks.py
  backend-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firewatch
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: firewatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIREWATCH_TEST_DATABASE_URL: postgresql+psycopg://firewatch:ci-only-password@127.0.0.1:5432/firewatch_test
      FIREWATCH_OFFLINE_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hashed development lock and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check
      - name: Formatting, lint and types
        run: |
          ruff check scripts/compose_stack.py scripts/verify_compose.py
          ruff format --check scripts/compose_stack.py scripts/verify_compose.py
          ruff check scripts/scan_secrets.py scripts/release_metadata.py scripts/live_provider_smoke.py scripts/container_probe.py
          ruff format --check scripts/scan_secrets.py scripts/release_metadata.py scripts/live_provider_smoke.py scripts/container_probe.py
          ruff check src tests migrations scripts/native_postgres.py scripts/verify_bootstrap.py scripts/check_locks.py scripts/export_openapi.py scripts/demo_api.py scripts/demo_data.py scripts/export_handoff.py scripts/verify_demo.py scripts/verify_firms_handoff.py scripts/verify_worker.py scripts/prepare_replays.py scripts/verify_replays.py scripts/verify_pipeline.py scripts/verify_target_labels.py scripts/verify_splits.py scripts/verify_baselines.py scripts/verify_forest.py scripts/verify_evaluation.py scripts/verify_inference.py scripts/verify_registry.py scripts/verify_acceptance.py scripts/verify_training_backfill.py scripts/verify_evidence.py scripts/contract_tools.py scripts/verify_anchoring.py
          ruff format --check src tests migrations scripts/native_postgres.py scripts/verify_bootstrap.py scripts/check_locks.py scripts/export_openapi.py scripts/demo_api.py scripts/demo_data.py scripts/export_handoff.py scripts/verify_demo.py scripts/verify_firms_handoff.py scripts/verify_worker.py scripts/prepare_replays.py scripts/verify_replays.py scripts/verify_pipeline.py scripts/verify_target_labels.py scripts/verify_splits.py scripts/verify_baselines.py scripts/verify_forest.py scripts/verify_evaluation.py scripts/verify_inference.py scripts/verify_registry.py scripts/verify_acceptance.py scripts/verify_training_backfill.py scripts/verify_evidence.py scripts/contract_tools.py scripts/verify_anchoring.py
          mypy
      - name: Unit, PostgreSQL migration and integrity tests
        run: python -m pytest --cov=firewatch --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/test-results.xml
      - name: Retain regression and coverage reports even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firewatch-test-reports
          path: |
            artifacts/test-results.xml
            artifacts/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Live local anchoring acceptance
        run: |
          python scripts/contract_tools.py install
          python -m scripts.verify_anchoring
      - name: Export frontend OpenAPI contract
        run: |
          python scripts/export_openapi.py
          python -m scripts.export_handoff
          python -m scripts.verify_demo
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-openapi
          path: artifacts/openapi.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-frontend-handoff
          path: artifacts/handoff
          if-no-files-found: error
      - name: Verify CLI and build distributions
        run: |
          firewatch --help
          firewatch --version
          python -m build --no-isolation
          python scripts/release_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: firewatch-build
          path: |
            dist/*.whl
            dist/*.tar.gz
            artifacts/build-metadata.json
            artifacts/phase-5.4-smoke.json
          if-no-files-found: error
      - name: Verify runtime lock in an isolated environment
        run: |
          python -m venv /tmp/firewatch-runtime
          /tmp/firewatch-runtime/bin/python -m pip install --require-hashes -r requirements.lock
          /tmp/firewatch-runtime/bin/python -m pip install --no-deps dist/*.whl
          /tmp/firewatch-runtime/bin/python -m pip check
          /tmp/firewatch-runtime/bin/firewatch --help
          /tmp/firewatch-runtime/bin/firewatch verify-alert --help
          /tmp/firewatch-runtime/bin/firewatch anchor-worker --help
          /tmp/firewatch-runtime/bin/firewatch anchor-status --help
          /tmp/firewatch-runtime/bin/firewatch retry-anchor --help
          /tmp/firewatch-runtime/bin/firewatch verify-pipeline-handoff --help
          /tmp/firewatch-runtime/bin/firewatch verify-target-labels --help
          /tmp/firewatch-runtime/bin/firewatch verify-splits --help
          /tmp/firewatch-runtime/bin/firewatch compare-baselines --help
          /tmp/firewatch-runtime/bin/firewatch verify-baseline-comparison --help
          /tmp/firewatch-runtime/bin/firewatch train-forest --help
          /tmp/firewatch-runtime/bin/firewatch verify-forest --help
          /tmp/firewatch-runtime/bin/firewatch prepare-evaluation --help
          /tmp/firewatch-runtime/bin/firewatch evaluate-final --help
          /tmp/firewatch-runtime/bin/firewatch verify-evaluation --help
          /tmp/firewatch-runtime/bin/firewatch build-inference-bundle --help
          /tmp/firewatch-runtime/bin/firewatch verify-inference-bundle --help
          /tmp/firewatch-runtime/bin/firewatch train --help
          /tmp/firewatch-runtime/bin/firewatch evaluate --help
          /tmp/firewatch-runtime/bin/firewatch promote-model --help
          /tmp/firewatch-runtime/bin/firewatch rollback-model --help
          /tmp/firewatch-runtime/bin/firewatch export-baseline-release --help
          /tmp/firewatch-runtime/bin/firewatch verify-baseline-release --help
          /tmp/firewatch-runtime/bin/firewatch backfill-training-data --help
          /tmp/firewatch-runtime/bin/firewatch verify-backfill-chunk --help
          /tmp/firewatch-runtime/bin/firewatch merge-backfill-labels --help
          /tmp/firewatch-runtime/bin/firewatch fill-backfill-weather --help
          /tmp/firewatch-runtime/bin/python -c "import pyarrow; from firewatch.pipeline.handoff import feature_schema; assert len(feature_schema()) == 44"
  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FIREWATCH_OFFLINE_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install and test native Python package
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e . --no-deps --no-build-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/unit tests/contract -m "not integration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          firewatch --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
