# Target/dataset design frozen in Phase 4.1; no trained model or release thresholds.
schema_version: model-v1
status: target_design_frozen
active_scorer: baseline-v1
feature_schema_version: features-v1
label_horizon_hours: 24
label_radius_km: 2
frp_increase_min_mw: 5
frp_increase_fraction: 0.20
random_seed: 42
dataset_manifest: null
split_manifest: null
calibration_policy: null
priority_thresholds: null
# Member 4 freezes dataset paths, splits, and policies before training.

# Conservative compatibility gate for existing whole-cluster features-v1 inputs.
# Eligibility is necessary but never sufficient for labels, splits or training.
target_input_policy: compact-centroid-inputs-v1
wide_cluster_policy: exclude
incomplete_current_frp_policy: exclude

target_spec: configs/target-v1.yaml
target_dataset_design: configs/target-dataset-v1.yaml

# Phase 4.2 policy is frozen; supervised release remains unavailable.
event_group_spec: configs/event-groups-v1.yaml
split_spec: configs/splits-v1.yaml

# Phase 4.3 artifact-free policies; thresholds and weights remain provisional.
baseline_policies: configs/baselines-v1.yaml

# Phase 4.4 offline candidate policy; no trained or approved artifact is active.
forest_training_spec: configs/forest-v1.yaml

# Phase 4.6 runtime contract; this does not activate or approve any ML model.
inference_bundle_schema: inference-bundle-v1
inference_contract: docs/inference-feature-contract-v1.json
explanation_method: exact-tree-path-dependent-shap-v1
approved_inference_bundle: null

# Phase 4.7 promotion workflow; default ACTIVE_SCORER remains baseline-v1.
model_registry_schema: model-registry-v1
approval_review_schema: docs/model-approval-review-v1.schema.json
model_failure_policy: fail_run_without_fallback
required_ml_observations: [frp_max_mw, frp_sum_mw]
